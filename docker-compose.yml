services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: advatech_vector_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: advatech
      POSTGRES_PASSWORD: advatech_dev_password
      POSTGRES_DB: advatech_kb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
